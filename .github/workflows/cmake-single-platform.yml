name: Build with CMake

on: workflow_dispatch

env:
  BUILD_TYPE: Release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Package
      shell: pwsh
      run: |
        $out   = "build/${{env.BUILD_TYPE}}"
        $stage = "package/Kyra"
        New-Item -ItemType Directory -Force -Path $stage | Out-Null

        Copy-Item "$out/*" $stage -Recurse -Exclude *.pdb,*.ilk,*.exp,*.lib

        Copy-Item shaders  "$stage/shaders" -Recurse
        Copy-Item assets   "$stage/assets"  -Recurse
        Copy-Item THIRD_PARTY_NOTICES.md $stage

        Compress-Archive -Path $stage -DestinationPath Kyra-windows-x64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: Kyra-windows-x64
        path: Kyra-windows-x64.zip

    - name: Publish rolling release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest --cleanup-tag --yes || true

        gh release create latest Kyra-windows-x64.zip \
          --target "${{ github.sha }}" \
          --title "Latest version (${GITHUB_SHA::7})" \
          --notes "Build of main ${{ github.sha }}." \
          --latest
