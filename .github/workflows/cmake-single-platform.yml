name: Build with CMake

on: workflow_dispatch

env:
  BUILD_TYPE: Release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history, needed for the commit range

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Package
      shell: pwsh
      run: |
        $out   = "build/${{env.BUILD_TYPE}}"
        $stage = "package/Kyra"
        New-Item -ItemType Directory -Force -Path $stage | Out-Null

        Copy-Item "$out/*" $stage -Recurse -Exclude *.pdb,*.ilk,*.exp,*.lib

        Copy-Item shaders  "$stage/shaders" -Recurse
        Copy-Item assets   "$stage/assets"  -Recurse
        Copy-Item THIRD_PARTY_NOTICES.md $stage

        Compress-Archive -Path $stage -DestinationPath Kyra-windows-x64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: Kyra-windows-x64
        path: Kyra-windows-x64.zip

    - name: Publish release
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

        # Find the commit the previous release was built from
        PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
        if [ -n "$PREV_TAG" ]; then
          PREV_SHA=$(gh release view "$PREV_TAG" --json targetCommitish -q .targetCommitish)
          RANGE="${PREV_SHA}..${GITHUB_SHA}"
        else
          RANGE="${GITHUB_SHA}"
        fi

        COMMITS=$(git log --format='- %s' "$RANGE")

        NOTES="Build of main (${GITHUB_SHA}).

        ${COMMITS:-No new commits.}"

        gh release create "$TAG" Kyra-windows-x64.zip \
          --target "${GITHUB_SHA}" \
          --title "Latest version (${GITHUB_SHA::7})" \
          --notes "$NOTES" \
          --latest
